[package]
name = "bk"
version = "0.6.0"
authors = [
  "James Campos <james.r.campos@gmail.com>",
  "Shuo Chen <leo.chen.cipher@gmail.com>",
]
edition = "2021"
license = "MIT"
description = "Terminal Epub reader"
keywords = ["ebook", "epub"]
categories = ["command-line-utilities"]
readme = "README.md"
repository = "https://github.com/leochencipher/bk"


[dependencies]
argh = "^0.1"
crossterm = "^0.22"
ron = "^0.7"
roxmltree = "^0.14"
serde = "^1.0"
unicode-width = "^0.2"
viuer = { version = "^0.7.1" }
image = "^0.24"
chrono = "^0.4"
sha2 = "^0.10"
hex = "^0.4"
serde_json = "^1.0"
regex = "^1.0"
num2words = "^1.2"
hound = "^3.5"
ndarray = { version = "0.17", features = ["std"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native", "ndarray"] }

[dependencies.zip]
version = "^0.6.6"
default-features = false
features = ["deflate"]
